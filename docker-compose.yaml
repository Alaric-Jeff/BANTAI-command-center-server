services:
  # PostgreSQL 16 with PostGIS 3.4 pre-compiled
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bantai_local_db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data

  # Redis for WebSocket Pub/Sub & Heartbeat Timers
  redis:
    image: redis:7-alpine
    container_name: bantai_local_redis
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  pgdata_local: